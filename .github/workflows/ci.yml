name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same PR (or branch) cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Format, analyze and test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimum Flutter version declared in pubspec.yaml.
          - name: "3.38.1"
            flutter-version: "3.38.1"
          - name: stable
            channel: stable
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: ${{ matrix.channel || 'stable' }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The formatter output differs between Flutter versions, so it is only
      # checked with the floor version the code is formatted with.
      - name: Check formatting
        if: matrix.name != 'stable'
        run: dart format --output=none --set-exit-if-changed lib test

      # Test against the newest versions pubspec.yaml allows, not the ones
      # pinned in pubspec.lock (the lock file is not committed back).
      - name: Upgrade dependencies
        if: matrix.name == 'stable'
        run: flutter pub upgrade

      # example/ is built in the other job instead of analyzed here.
      # Infos fail the build on the floor version. On stable they don't: newer
      # Flutter deprecates APIs the floor still needs (for example
      # package:flutter/material.dart in favour of package:material_ui), and
      # moving to the replacements would break the floor.
      - name: Analyze
        run: flutter analyze lib test ${{ matrix.name == 'stable' && '--no-fatal-infos' || '' }}

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        if: matrix.name == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

      # Lower bounds in pubspec.yaml must still compile. Tests are not run on
      # the downgraded versions: a transitive dependency (platform 3.0.0) does
      # not compile with this Flutter version, so the tests can't build.
      # This is the last step of the job, so the downgrade is not restored.
      - name: Downgrade dependencies
        if: matrix.name != 'stable'
        run: flutter pub downgrade

      - name: Analyze lower bounds
        if: matrix.name != 'stable'
        run: flutter analyze lib

  example:
    name: Example app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      # Smoke check that the package compiles in a real app (JS and Wasm).
      - name: Build for web
        run: flutter build web --wasm

  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Flutter stable (3.50) needs Gradle 9.3.1+, which the example's AGP
          # (8.11) can't use, so build with the floor version.
          flutter-version: "3.38.1"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Catches Gradle/AGP/Kotlin breakage in the example app.
      - name: Build debug APK
        run: flutter build apk --debug
