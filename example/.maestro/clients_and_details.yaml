# Every client the example offers logs its requests: Dio
# (RequestsInspectorInterceptor: GET, POST JSON, FormData, HEAD, a 404),
# GraphQL (GraphQLInspectorLink, with and without variables) and a manual
# InspectorController().addNewRequest call ("Manual log"). Each one shows up in the list
# with its method, name, URL and status code, and its details page shows
# headers, query parameters, the request body (JSON, form data or the
# GraphQL query), GraphQL variables and the response body as a JSON tree.
appId: com.example.example
name: Every client is logged, with its details
---
- runFlow: subflows/launch_playground.yaml
- runFlow:
    file: subflows/send.yaml
    env:
      NAME: "Dio GET"
- assertVisible: 'echo query: \{"source":"playground","page":"1"\}'
- runFlow:
    file: subflows/send.yaml
    env:
      NAME: "Dio POST JSON"
- assertVisible: "status: 200"
- runFlow:
    file: subflows/send.yaml
    env:
      NAME: "Dio FormData"
- assertVisible: 'echo form: \{"test\[0\]":"0","test\[1\]":"1","test\[2\]":"2","test\[3\]":"3"\}'
- runFlow:
    file: subflows/send.yaml
    env:
      NAME: "Dio HEAD"
- assertVisible: "status: 200"
- runFlow:
    file: subflows/send.yaml
    env:
      NAME: "Dio 404"
- assertVisible: "status: 404"
- runFlow:
    file: subflows/send.yaml
    env:
      NAME: "GraphQL query"
- assertVisible: "post: 1 .+"
- runFlow:
    file: subflows/send.yaml
    env:
      NAME: "GraphQL vars"
- assertVisible: "post: 1 .+"
- runFlow:
    file: subflows/send.yaml
    env:
      NAME: "Manual log"
- assertVisible: "status: 200"

# The list: one row per request, newest first. A row is one accessibility
# element: "<method>\n<duration>\n<name>\n<url>\n<status>".
- runFlow: subflows/open_inspector.yaml
- assertVisible: "(?s)GET.*MANUAL.*https://postman-echo.com/get.*200"
# GraphQL rows are named after the operation name the app passes (none
# here), else after the URL: both are "API".
- assertVisible:
    text: "(?s)POST.*API.*https://graphqlzero.almansi.me/api.*200"
    index: 1
- assertVisible: "(?s)GET.*404.*https://postman-echo.com/status/404.*404"
- assertVisible: "(?s)HEAD.*GET.*https://postman-echo.com/get.*200"
- scrollUntilVisible:
    element: "(?s)GET.*GET.*https://postman-echo.com/get.*200"
    direction: DOWN
- assertVisible:
    text: "(?s)POST.*POST.*https://postman-echo.com/post.*200"
    index: 1
- assertVisible: "(?s)GET.*GET.*https://postman-echo.com/get.*200"

# Dio POST with a JSON body (the older of the two POSTs to /post; the list
# is still scrolled down to it).
- tapOn:
    text: "(?s)POST.*POST.*https://postman-echo.com/post.*"
    index: 1
- assertVisible: "(?s)POST - POST.*Status: 200.*"
- assertVisible: "(?s)Sent at: .*Received at: .*Duration: .*URL: https://postman-echo.com/post"
- assertVisible: "(?s)Headers.*"
- assertVisible: '"x-e2e" : "original",'
- assertVisible: "(?s)Query Parameters.*"
- assertVisible: '"step" : "original",'
- scrollUntilVisible:
    element: '"verified" : false,'
    direction: DOWN
- assertVisible: "(?s)Request Body.*"
- assertVisible: '"name" : "original",'
- assertVisible: '"count" : 1,'
- assertVisible: '"active" : true,'
- assertVisible: '"profile" : \{.*'
- assertVisible: '"age" : 30,'
- scrollUntilVisible:
    element: "(?s)Response Body.*"
    direction: DOWN
- scrollUntilVisible:
    element: '"url" : "https://postman-echo.com/post\?step=original",'
    direction: DOWN
- takeScreenshot: details-post-json

# Dio FormData: fields and files.
- runFlow:
    file: subflows/open_request.yaml
    env:
      ROW: "(?s)POST.*POST.*https://postman-echo.com/post.*"
- scrollUntilVisible:
    element: "(?s)Request Body \\(Form Data\\).*"
    direction: DOWN
- scrollUntilVisible:
    element: '"test_file" : "\(0\.0 kb\) - test\.txt",'
    direction: DOWN
- assertVisible: '"test\[3\]" : "3",'
- assertVisible: '"test_image" : "\(\d+\.0 kb\) - flutter_logo\.png",'
- takeScreenshot: details-formdata

# GraphQL with variables (the newer GraphQL row): the query is the body,
# the variables have their own section.
- runFlow:
    file: subflows/open_request.yaml
    env:
      ROW: "(?s)POST.*API.*https://graphqlzero.almansi.me/api.*"
- assertVisible: "(?s)POST - API.*Status: 200.*"
- scrollUntilVisible:
    element: "(?s)GraphQL Request Vars.*"
    direction: DOWN
- assertVisible: '"query GetPost\(\$id: ID!\) \{.*'
- scrollUntilVisible:
    element: '"id" : 1,'
    direction: DOWN
- takeScreenshot: details-graphql-vars

# GraphQL without variables (the older row): no variables section. The
# list keeps its scroll offset, so scroll back to its newest row first.
- tapOn: "All"
- scrollUntilVisible:
    element: "(?s)GET.*MANUAL.*https://postman-echo.com/get.*"
    direction: UP
- tapOn:
    text: "(?s)POST.*API.*https://graphqlzero.almansi.me/api.*"
    index: 1
- assertVisible: "(?s)POST - API.*Status: 200.*"
- scrollUntilVisible:
    element: '"(query )?\{.*post\(id: 1\).*'
    direction: DOWN
- scrollUntilVisible:
    element: "(?s)Response Body.*"
    direction: DOWN
- assertNotVisible: "(?s)GraphQL Request Vars.*"

# The manual addNewRequest entry keeps the name and headers it was given.
- runFlow:
    file: subflows/open_request.yaml
    env:
      ROW: "(?s)GET.*MANUAL.*https://postman-echo.com/get.*"
- assertVisible: "(?s)GET - MANUAL.*Status: 200.*"
- assertVisible: '"language" : "en",'
- assertVisible: '"manual" : "yes",'

# HEAD and the 404.
- runFlow:
    file: subflows/open_request.yaml
    env:
      ROW: "(?s)HEAD.*https://postman-echo.com/get.*"
- assertVisible: "(?s)HEAD - GET.*Status: 200.*"
- runFlow:
    file: subflows/open_request.yaml
    env:
      ROW: "(?s)GET.*404.*https://postman-echo.com/status/404.*"
- assertVisible: "(?s)GET - 404.*Status: 404.*"
