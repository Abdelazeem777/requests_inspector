# Smoke test for the example app: log a few requests, open the inspector
# with a long press (shaking is not reliable on simulators), open a
# request's details, go back to the list and close the inspector (and, on
# Android, close it again with the back button).
# The example calls the real https://dummyjson.com/posts endpoint.
#
# Every step finds its element in the accessibility tree (no screen
# positions), so the flow also checks that RequestsInspector keeps the host
# app visible to accessibility services.
appId: com.example.example
name: Requests inspector smoke test
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 5000

- assertVisible: "Fetch Data Example"

# A second request: the refresh icon at the start of the app bar.
- tapOn: "Refresh"

# ShowInspectorOn.Both (the default): long press anywhere on the host app.
- longPressOn: "Fetch Data Example"
- extendedWaitUntil:
    visible: "Inspector.*"
    timeout: 10000
- assertVisible: "Clear All"

# Both requests show up as rows once their responses arrive. A row is one
# accessibility element: "GET\n<duration>\nPOSTS\n<url>\n<status>".
- extendedWaitUntil:
    visible:
      text: "(?s)GET.*POSTS.*https://dummyjson.com/posts.*"
      index: 1
    timeout: 30000

# Request details.
- tapOn:
    text: "(?s)GET.*POSTS.*"
    index: 0
- assertVisible: "(?s).*GET - POSTS.*"
- assertVisible: "(?s).*Status: .*"
- assertVisible: "(?s).*Headers.*"
- assertVisible: "(?s).*Query Parameters.*"
# Below the fold on smaller screens.
- scrollUntilVisible:
    element: "(?s).*Response Body.*"
    direction: DOWN

# Back to the list.
- tapOn: "All"
- assertVisible:
    text: "(?s)GET.*POSTS.*"
    index: 1

# Close the inspector with the X at the start of its app bar.
- tapOn: "Close inspector"
- waitForAnimationToEnd
- assertNotVisible: "Clear All"
- assertVisible: "Fetch Data Example"

# It opens again with the same requests.
- longPressOn: "Fetch Data Example"
- extendedWaitUntil:
    visible:
      text: "(?s)GET.*POSTS.*"
      index: 1
    timeout: 10000

# Android: system back closes the inspector, not the app behind it.
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: back
      - assertNotVisible: "Clear All"
      - assertVisible: "Fetch Data Example"
