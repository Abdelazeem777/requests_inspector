# Starts the example with a clean state and opens the Playground page
# (lib/playground.dart), which sends requests with every client.
appId: com.example.example
---
- launchApp:
    clearState: true
# A debug build can take a while to start after its data is cleared.
- extendedWaitUntil:
    visible: "Playground"
    timeout: 30000
- tapOn: "Playground"
- extendedWaitUntil:
    visible: "Tap a button to send a request"
    timeout: 10000
