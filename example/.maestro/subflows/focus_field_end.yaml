# Puts the cursor at the end of a stopper editor field (env FIELD: a regex
# of the field's current text), ready for eraseText + inputText.
#
# One tap is enough: the bottom right corner of the field is past its last
# line, so the cursor lands at the end of the text, and it stays there when
# the keyboard opens.
appId: com.example.example
---
# A field below the screen's lower part is not in the accessibility tree
# yet: scroll the dialog with slow swipes inside it until it is.
- repeat:
    while:
      notVisible: ${FIELD}
    times: 6
    commands:
      - swipe:
          start: "50%,30%"
          end: "50%,15%"
          duration: 1500
      - waitForAnimationToEnd
- tapOn:
    text: ${FIELD}
    point: "95%,95%"
- waitForAnimationToEnd
