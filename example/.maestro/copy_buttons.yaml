# The copy icon of each section on the Request Details tab puts that
# section on the clipboard and shows "Copied to clipboard".
# Each icon is found by its tooltip (Copy URL, Copy Headers, ...).
appId: com.example.example
name: Copy buttons on the details page
---
- runFlow: subflows/launch_playground.yaml
- runFlow:
    file: subflows/send.yaml
    env:
      NAME: "Dio POST JSON"
- runFlow: subflows/open_inspector.yaml
- runFlow:
    file: subflows/open_request.yaml
    env:
      ROW: "(?s)POST.*POST.*https://postman-echo.com/post.*"

# First section: the URL.
- tapOn: "Copy URL"
- assertVisible: "Copied to clipboard"
- runFlow: subflows/close_inspector.yaml
- runFlow: subflows/read_clipboard.yaml
# The plain URL, without quotes.
- assertVisible: 'clipboard text: https://postman-echo\.com/post'

# Headers.
- runFlow: subflows/open_inspector.yaml
- tapOn: "Copy Headers"
- assertVisible: "Copied to clipboard"
- runFlow: subflows/close_inspector.yaml
- runFlow: subflows/read_clipboard.yaml
- assertVisible: '(?s)clipboard text: \{\s+"x-e2e": "original",\s+"content-type": "application/json",\s+"content-length": "\d+"\s+\}'

# Query parameters.
- runFlow: subflows/open_inspector.yaml
- tapOn: "Copy Query Parameters"
- assertVisible: "Copied to clipboard"
- runFlow: subflows/close_inspector.yaml
- runFlow: subflows/read_clipboard.yaml
- assertVisible: '(?s)clipboard text: \{\s+"step": "original"\s+\}'

# Request body.
- runFlow: subflows/open_inspector.yaml
- scrollUntilVisible:
    element: "Request Body"
    direction: DOWN
    centerElement: true
# Let the list settle, or the tap can land on the header and collapse it.
- waitForAnimationToEnd
- tapOn: "Copy Request Body"
- assertVisible: "Copied to clipboard"
- runFlow: subflows/close_inspector.yaml
- runFlow: subflows/read_clipboard.yaml
- assertVisible: >-
    (?s)clipboard text: \{\s+"name": "original",\s+"count": 1,\s+"active": true,\s+"note": "it's \\"quoted\\"",\s+"profile": \{\s+"age": 30,\s+"verified": false\s+\}\s+\}

# Response body (postman-echo's answer).
- runFlow: subflows/open_inspector.yaml
- scrollUntilVisible:
    element: "Response Body"
    direction: DOWN
    centerElement: true
# Let the list settle, or the tap can land on the header and collapse it.
- waitForAnimationToEnd
- tapOn: "Copy Response Body"
- assertVisible: "Copied to clipboard"
- runFlow: subflows/close_inspector.yaml
- runFlow: subflows/read_clipboard.yaml
- assertVisible: '(?s)clipboard text: \{\s+"args": \{\s+"step": "original"\s+\},.*"json": \{\s+"name": "original",.*\}\s*'
