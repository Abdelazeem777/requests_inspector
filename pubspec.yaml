name: requests_inspector
description: A Flutter package for logging REST-APIs and GraphQL requests and
  accessing it by Shaking your phone to get the RequestsInspector widget on your
  screen.
version: 6.0.0
homepage: https://github.com/Abdelazeem777/requests_inspector
repository: https://github.com/Abdelazeem777/requests_inspector
issue_tracker: https://github.com/Abdelazeem777/requests_inspector/issues
topics:
  - network
  - http
  - dio
  - debugging
  - inspector
# we can add screenshots here using screenshots key
# please check this link https://dart.dev/tools/pub/pubspec#screenshots

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  dio: ^5.8.0+1
  flutter:
    sdk: flutter
  gql: ^1.0.1
  graphql: ^5.2.4
  provider: ^6.1.5
  sensors_plus: ^7.0.0
  share_plus: ^13.1.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  http: ^1.2.0
  share_plus_platform_interface: ^7.1.0
